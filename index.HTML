<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>NOBITA AI ChatBot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="stylesheet.CSS">
  <style>
    :root {
      --primary: #ffe066;
      --secondary: #ffd60a;
      --accent: #fffbe6;
      --glass-bg: rgba(255, 255, 200, 0.13);
      --glass-border: rgba(255, 255, 200, 0.22);
      --shadow: 0 8px 32px 0 rgba(255, 220, 80, 0.25);
      --gradient: linear-gradient(120deg, #181818 0%, #232323 60%, #3a2d00 100%);
      --text-dark: #ffe066;
      --text-light: #fffbe6;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Epilogue', sans-serif;
      background: var(--gradient);
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-dark);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- AI Chatbot Section ONLY -->
  <div class="card" style="position:relative; right:unset; bottom:unset; max-width:390px; width:30vw; min-width:290px; margin:auto;">
    <div id="header"><h1>ChatBot</h1></div>
    <div id="message-section"></div>
    <div id="input-section">
      <input id="chat-input" type="text" placeholder="Type your message here..." autocomplete="off" />
      <button class="send" id="send-btn"><span class="circle"><i class="bi bi-arrow-up-circle-fill"></i></span></button>
    </div>
  </div>
  <script src="script.JS"></script>
  
</body>
</html>
