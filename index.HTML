<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>NOBITA AI ChatBot</title>
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="NOBITA.css">
  <style>
    :root {
      --primary: #ffe066;
      --secondary: #ffd60a;
      --accent: #fffbe6;
      --glass-bg: rgba(255, 255, 200, 0.13);
      --glass-border: rgba(255, 255, 200, 0.22);
      --shadow: 0 8px 32px 0 rgba(255, 220, 80, 0.25);
      --gradient: linear-gradient(120deg, #181818 0%, #232323 60%, #3a2d00 100%);
      --text-dark: #ffe066;
      --text-light: #fffbe6;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Epilogue', sans-serif;
      background: var(--gradient);
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-dark);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- AI Chatbot Section ONLY -->
  <div class="card" style="position:relative; right:unset; bottom:unset; max-width:390px; width:30vw; min-width:290px; margin:auto;">
    <div id="header"><h1>ChatBot</h1></div>
    <div id="message-section"></div>
    <div id="input-section">
      <input id="chat-input" type="text" placeholder="Type your message here..." autocomplete="off" />
      <button class="send" id="send-btn"><span class="circle"><i class="bi bi-arrow-up-circle-fill"></i></span></button>
    </div>
  </div>
  <script src="NOBITA.JS"></script>
  <script>
    const messageSection = document.getElementById("message-section");
    const input = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    async function addMessage(content, isUser) {
      const div = document.createElement("div");
      div.className = "message";
      div.id = isUser ? "user" : "bot";
      div.innerHTML = `<span id="${isUser ? 'user-response' : 'bot-response'}">${content}</span>`;
      messageSection.appendChild(div);
      messageSection.scrollTop = messageSection.scrollHeight;
    }
    async function handleSend() {
      const userText = input.value.trim();
      if (!userText) return;
      addMessage(userText, true);
      input.value = "";
      addMessage("<span style='color:#999'>Thinking...</span>", false);
      try {
        const data = await askDeepSeek(userText);
        messageSection.lastChild.remove(); // remove 'Thinking...'
        let reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) ? data.choices[0].message.content : (data.error ? JSON.stringify(data.error) : "No response");
        addMessage(reply, false);
      } catch (e) {
        messageSection.lastChild.remove();
        addMessage("Sorry, there was an error.", false);
      }
    }
    sendBtn.onclick = handleSend;
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") handleSend();
    });
  </script>
</body>
</html>
